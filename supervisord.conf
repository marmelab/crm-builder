# ── Unified supervisor config — MODE is read from the container environment ──
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn

[program:crm-frontend]
command=/app/node_modules/.bin/vite --host 0.0.0.0
directory=%(ENV_APP_DIR)s
user=developer
environment=ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/crm.log
stderr_logfile=/var/log/crm-err.log
priority=10

[program:chat-service]
command=node /chat-service/server.js
directory=/chat-service
user=developer
environment=HOME="/home/developer",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",CLAUDE_PROJECT_DIR="/app",MODE="%(ENV_MODE)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/chat.log
stderr_logfile=/var/log/chat-err.log
priority=30
