name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chat-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chat-service/package-lock.json

      - name: Install dependencies
        run: cd chat-service && npm ci

      - name: Unit tests
        run: make test-unit

      - name: Smoke test (WebSocket + HTTP API)
        run: make test-smoke
