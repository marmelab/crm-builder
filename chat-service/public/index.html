<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomic CRM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/chat.css">
</head>
<body>
  <iframe id="crm-frame" src="http://localhost:5173" allow="same-origin"></iframe>

  <div id="chat-widget" class="chat-open">
    <div id="chat-header">
      <div id="chat-header-icon">✦</div>
      <span id="chat-title" title="Click to rename">CRM Assistant</span>
      <span id="chat-state" class="state-in_progress" aria-label="Session state"></span>
      <button id="chat-stats-btn" hidden title="Session stats" aria-label="Show session statistics">📊</button>
      <button id="chat-stop" title="Stop Claude" aria-label="Stop" hidden>⏹</button>
      <button id="chat-debug" title="Debug OFF" aria-label="Toggle debug">🔍</button>
      <button id="chat-expand" title="Expand" aria-label="Expand chat">⤢</button>
      <button id="chat-toggle" aria-label="Toggle chat">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-stats-panel" hidden></div>
    <form id="chat-form">
      <textarea
        id="chat-input"
        placeholder="Ask me to customize your CRM..."
        rows="1"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="chat-send" aria-label="Send">↑</button>
    </form>
    <div id="chat-stats" title="Tokens and cost used in this session"></div>
  </div>

  <div id="chat-actions">
    <button id="chat-history" title="History" aria-label="Session history">📂</button>
    <button id="chat-new" title="New session" aria-label="New session">✚</button>
    <div id="chat-history-panel" hidden>
      <div id="history-panel-header">
        <span>Sessions</span>
        <button id="history-close" aria-label="Close history">✕</button>
      </div>
      <ul id="history-list"></ul>
      <div id="history-empty" hidden>No saved sessions.</div>
    </div>
  </div>

  <button id="chat-fab" aria-label="Open assistant">✦</button>

  <script type="module" src="/chat.js"></script>
</body>
</html>
