# ── Full mode — Vite + ttyd (Supabase already started by entrypoint) ──
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn

[program:crm-frontend]
command=npm run dev -- --host 0.0.0.0
directory=%(ENV_APP_DIR)s
user=developer
environment=ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/crm.log
stderr_logfile=/var/log/crm-err.log
priority=10

[program:ttyd]
command=/usr/local/bin/ttyd --port 7681 --writable --interface 0.0.0.0 /usr/local/bin/ttyd-session.sh
user=developer
environment=ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",APP_DIR="%(ENV_APP_DIR)s",MODE="full",HOME="/home/developer"
autostart=true
autorestart=true
stdout_logfile=/var/log/ttyd.log
stderr_logfile=/var/log/ttyd-err.log
priority=20

[program:chat-service]
command=node /chat-service/server.js
directory=/chat-service
user=developer
environment=HOME="/home/developer",ANTHROPIC_API_KEY="%(ENV_ANTHROPIC_API_KEY)s",CLAUDE_PROJECT_DIR="/app",MODE="full"
autostart=true
autorestart=true
stdout_logfile=/var/log/chat.log
stderr_logfile=/var/log/chat-err.log
priority=30
