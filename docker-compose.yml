# ─────────────────────────────────────────────────────────────
#  docker compose --profile demo up   → FakeRest mode (lightweight)
#  docker compose --profile full up   → Supabase mode (full stack)
# ─────────────────────────────────────────────────────────────

x-base: &base
  build: .
  image: atomic-crm-dev
  environment:
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
  volumes:
    # Single volume covers the entire atomic-crm repo:
    #   src/, .git/, supabase/, e2e/, scripts/, configs at root, node_modules/, …
    # Worktrees live at /app/worktrees (gitignored) so cp -al hard-links
    # against /app/node_modules stay on the same device.
    - crm-app:/app

services:

  # ── Demo mode — FakeRest, starts in seconds ────────────────
  crm-demo:
    <<: *base
    profiles: [ demo ]
    container_name: atomic-crm-demo
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODE=demo
    ports:
      - "5173:5173" # CRM
      - "7681:7681" # Claude terminal
      - "8080:8080" # Chat assistant
    volumes:
      - crm-app:/app
      - claude-auth:/home/developer/.claude
      # DEV ONLY — bind mounts pour itérer sur la config sans rebuild.
      # Entrypoint sync ces fichiers vers /home/developer/.claude au boot.
      # RETIRER avant release production (config doit vivre dans l'image).
      - ./claudeConfig/.claude:/root/.claude:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./chat-service/server.js:/chat-service/server.js:ro
      - ./chat-service/public:/chat-service/public:ro
      - ./chat-service/lib:/chat-service/lib:ro
      # DEV ONLY — logs structurés des sessions chat pour review/analyse.
      # RETIRER avant release production.
      - ./sessions:/chat-service/logs

  # ── Full mode — local Supabase, requires Docker socket ─────
  crm-full:
    <<: *base
    profiles: [ full ]
    container_name: atomic-crm-full
    network_mode: host # Supabase runs on the host via Docker socket;
                       # host networking makes localhost:54321 reachable from inside the container
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODE=full
    # No ports: with network_mode: host, host ports are directly exposed
    volumes:
      - crm-app:/app
      - claude-auth:/home/developer/.claude
      - /var/run/docker.sock:/var/run/docker.sock # ⚠️ required
      - supabase-cache:/root/.docker              # cache pulled images

volumes:
  crm-app:
  supabase-cache:
  claude-auth:
