# ─────────────────────────────────────────────────────────────
#  docker compose up              → starts in demo mode (FakeRest)
#  docker compose up -e MODE=full → starts in full mode (Supabase)
#
#  The data mode can also be switched at runtime from the chat UI.
#  network_mode: host exposes all ports directly on the host and
#  makes Supabase's localhost:54321 reachable from inside the
#  container when MODE=full or when switched at runtime.
#
# ─────────────────────────────────────────────────────────────

services:

  crm-app:
    build: .
    image: atomic-crm-dev
    container_name: atomic-crm
    network_mode: host
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODE=${MODE:-demo}
    volumes:
      - crm-app:/app
      # Shared volume carries ONLY the OAuth login (entrypoint.sh symlinks the
      # credential files into .claude). The harness config — agents, skills,
      # hooks, rules, settings.json — comes purely from the image, so each
      # instance runs its own branch's harness and a parallel instance can never
      # overwrite it via this volume.
      - claude-auth:/home/developer/.claude-auth
      - /var/run/docker.sock:/var/run/docker.sock
      - supabase-cache:/root/.docker
      - supabase-deploy-config:/var/lib/atomic-crm/supabase-deploy
      - ./sessions:/chat-service/logs

volumes:
  crm-app:
  supabase-cache:
  # Pinned name so the OAuth login survives `-p <instance>` namespacing and is
  # shared with every multi-instance stack (see docker-compose.multi.yml).
  # Mounted at /home/developer/.claude-auth (login only) — NOT over .claude.
  claude-auth:
    name: atomic-crm-claude-auth
  # Same pinning rationale: deploy credentials must survive multi-instance
  # namespacing so the user does not reconfigure after every `-p` change.
  supabase-deploy-config:
    name: atomic-crm-supabase-deploy-config
