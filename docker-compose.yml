# ─────────────────────────────────────────────────────────────
#  docker compose up              → starts in demo mode (FakeRest)
#  docker compose up -e MODE=full → starts in full mode (Supabase)
#
#  The data mode can also be switched at runtime from the chat UI.
#  network_mode: host exposes all ports directly on the host and
#  makes Supabase's localhost:54321 reachable from inside the
#  container when MODE=full or when switched at runtime.
# ─────────────────────────────────────────────────────────────

services:

  crm-app:
    build: .
    image: atomic-crm-dev
    container_name: atomic-crm
    network_mode: host
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODE=${MODE:-demo}
    volumes:
      - crm-app:/app
      - claude-auth:/home/developer/.claude
      - /var/run/docker.sock:/var/run/docker.sock
      - supabase-cache:/root/.docker
      - ./sessions:/chat-service/logs
      - crm-docs:/app/docs

volumes:
  crm-app:
  supabase-cache:
  claude-auth:
  crm-docs:
